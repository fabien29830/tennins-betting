name: Tennis Auto

# ──────────────────────────────────────────────────────────────
# GitHub Actions ne supporte pas les fuseaux horaires nativement.
# Stratégie : cron UTC large couvrant hiver (UTC+1) ET été (UTC+2),
# puis vérification de l'heure Europe/Paris dans le job pour filtrer
# les runs hors fenêtre.
#
#   --analyse  : toutes les heures entre 07:00 et 23:00 Europe/Paris
#                Cron UTC : 0 5-22 * * *
#                  → couvre 07h-23h en hiver (UTC+1 → 06h-22h UTC)
#                  → couvre 07h-23h en été   (UTC+2 → 05h-21h UTC)
#                  → runs hors fenêtre ignorés via check Paris
#
#   --resultats : une fois par jour à 23:30 Europe/Paris
#                Cron UTC : 30 21 * * *  (23:30 Paris été = 21:30 UTC)
#                           30 22 * * *  (23:30 Paris hiver = 22:30 UTC)
#                → un seul des deux triggers passera le check Paris
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    # --analyse : toutes les heures, 07h00-23h00 Europe/Paris
    - cron: '0 5-22 * * *'

    # --resultats : 23h30 Europe/Paris (hiver = 22h30 UTC, été = 21h30 UTC)
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'

  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode à exécuter'
        required: true
        default: 'analyse'
        type: choice
        options:
          - analyse
          - resultats
          - pipeline

jobs:
  tennis:
    name: "Tennis Auto"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Récupérer le code ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ─────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dépendances ─────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Restaurer les données générées (CSV, pkl) ───────
      - name: Restore tennis_data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ github.run_id }}
          restore-keys: |
            tennis-data-

      # ── 5. Écrire les credentials Google depuis le secret ──
      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p tennis_data
          printf '%s' "$GOOGLE_CREDENTIALS" > tennis_data/gsheet_credentials.json

      # ── 6. Déterminer le mode + vérifier la fenêtre Paris ──
      - name: Determine run mode
        id: mode
        run: |
          # Heure et minute courantes en Europe/Paris (gère hiver/été auto)
          PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
          PARIS_MIN=$(TZ="Europe/Paris" date +%M)
          PARIS_TIME="${PARIS_HOUR}h${PARIS_MIN}"
          echo "Heure Europe/Paris : $PARIS_TIME"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Déclenchement manuel → utiliser l'input directement
            MODE="${{ inputs.mode }}"

          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ] || \
               [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            # Cron résultats : valide uniquement si Paris = 23hxx
            if [ "$PARIS_HOUR" = "23" ]; then
              MODE="resultats"
            else
              MODE="skip"
              echo "  → Trigger résultats hors-saison ($PARIS_TIME) — ignoré"
            fi

          else
            # Cron analyse (0 5-22) : valide si 07h ≤ Paris ≤ 23h
            if [ "$PARIS_HOUR" -ge 7 ] && [ "$PARIS_HOUR" -le 23 ]; then
              MODE="analyse"
            else
              MODE="skip"
              echo "  → Hors fenêtre 07h-23h Paris ($PARIS_TIME) — ignoré"
            fi
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "▶  Mode sélectionné : $MODE ($PARIS_TIME Europe/Paris)"

      # ── 7a. Pipeline complet (manuel uniquement) ───────────
      - name: Run pipeline
        if: steps.mode.outputs.mode == 'pipeline'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --pipeline

      # ── 7b. Analyse + value bets (toutes les heures 07h-23h) ─
      - name: Run analyse
        if: steps.mode.outputs.mode == 'analyse'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # Fallback : pipeline si données absentes (premier run ou cache expiré)
          if [ ! -f tennis_data/modele_tennis.pkl ]; then
            echo "⚠  Modèle absent — exécution du pipeline complet d'abord..."
            python tennis_auto.py --pipeline
          fi
          python tennis_auto.py --analyse

      # ── 7c. Résultats (23h30 Europe/Paris) ─────────────────
      - name: Run resultats
        if: steps.mode.outputs.mode == 'resultats'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ ! -f tennis_data/modele_tennis.pkl ]; then
            echo "⚠  Modèle absent — exécution du pipeline complet d'abord..."
            python tennis_auto.py --pipeline
          fi
          python tennis_auto.py --resultats

      # ── 8. Sauvegarder le cache après pipeline ou premier run ─
      - name: Save tennis_data cache
        if: >
          steps.mode.outputs.mode == 'pipeline' ||
          (steps.mode.outputs.mode == 'analyse'   && steps.cache-data.outputs.cache-hit != 'true') ||
          (steps.mode.outputs.mode == 'resultats' && steps.cache-data.outputs.cache-hit != 'true')
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ github.run_id }}

      # ── 9. Uploader le rapport comme artifact (30 jours) ───
      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: tennis_data/rapports/
          retention-days: 30
          if-no-files-found: ignore
