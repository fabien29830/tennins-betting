name: Tennis Auto

# ──────────────────────────────────────────────────────────────
# Cron unique UTC couvrant 07h-23h Europe/Paris (hiver ET été)
#   Hiver UTC+1 : 05h-22h UTC = 06h-23h Paris  → valide 07h-23h
#   Été   UTC+2 : 05h-22h UTC = 07h-00h Paris  → valide 07h-23h
#
# Chaque run exécute les deux étapes en séquence :
#   1. --resultats  (met à jour Gagné/Perdu dès qu'un match est fini)
#   2. --analyse    (détecte les nouveaux value bets)
#
# Runs hors fenêtre 07h-23h Paris → ignorés silencieusement (skip)
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    # Toutes les heures, 07h-23h Europe/Paris (hiver et été)
    - cron: '0 5-22 * * *'

  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode à exécuter'
        required: true
        default: 'hourly'
        type: choice
        options:
          - hourly      # resultats + analyse (comportement normal)
          - analyse     # analyse seule
          - resultats   # résultats seuls
          - pipeline    # pipeline complet (data + elo + modèle + analyse)

jobs:
  tennis:
    name: "Tennis Auto"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dépendances ──────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Cache données (CSV, pkl) ─────────────────────────
      - name: Restore tennis_data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ github.run_id }}
          restore-keys: |
            tennis-data-

      # ── 5. Credentials Google (toujours depuis le secret) ───
      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p tennis_data
          printf '%s' "$GOOGLE_CREDENTIALS" > tennis_data/gsheet_credentials.json

      # ── 6. Vérifier la fenêtre horaire Europe/Paris ─────────
      - name: Check Paris time window
        id: timecheck
        run: |
          PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
          PARIS_TIME="$(TZ='Europe/Paris' date '+%H:%M') Europe/Paris"
          echo "Heure actuelle : $PARIS_TIME"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "  → Déclenchement manuel, pas de vérification horaire"
          elif [ "$PARIS_HOUR" -ge 7 ] && [ "$PARIS_HOUR" -le 23 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "  → Dans la fenêtre 07h-23h ✓"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "  → Hors fenêtre 07h-23h ($PARIS_TIME) — run ignoré"
          fi

      # ── 7. Fallback pipeline si données absentes ────────────
      - name: Bootstrap pipeline (si cache absent)
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          steps.cache-data.outputs.cache-hit != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          echo "⚠  Cache absent — exécution du pipeline complet..."
          python tennis_auto.py --pipeline

      # ── 8a. Pipeline complet (manuel uniquement) ────────────
      - name: Run pipeline
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'pipeline')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --pipeline

      # ── 8b. Résultats ────────────────────────────────────────
      #   Toutes les heures (hourly) OU mode resultats manuel
      - name: Run resultats
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          inputs.mode != 'pipeline' &&
          inputs.mode != 'analyse'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --resultats

      # ── 8c. Analyse ──────────────────────────────────────────
      #   Toutes les heures (hourly) OU mode analyse manuel
      - name: Run analyse
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          inputs.mode != 'pipeline' &&
          inputs.mode != 'resultats'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --analyse

      # ── 9. Sauvegarder le cache ──────────────────────────────
      - name: Save tennis_data cache
        if: steps.timecheck.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ github.run_id }}

      # ── 10. Rapport en artifact (30 jours) ──────────────────
      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ github.run_id }}
          path: tennis_data/rapports/
          retention-days: 30
          if-no-files-found: ignore
