name: Tennis Auto

# ──────────────────────────────────────────────────────────────
# Deux schedules :
#   1. Lundi 06h UTC = 07h Paris (hiver) → pipeline complet
#      data + Elo + modèle + analyse
#   2. Mar-Dim 7h,12h,18h UTC → resultats + analyse
#
# Le timecheck détecte automatiquement si c'est un run pipeline
# ou un run analyse classique.
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    # Pipeline complet : lundi 6h UTC = 7h Paris (hiver UTC+1)
    - cron: '0 6 * * 1'
    # Analyse 3x/jour (mar-dim) : 7h, 12h, 18h UTC
    - cron: '0 7,12,18 * * 2,3,4,5,6,0'

  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode à exécuter'
        required: true
        default: 'hourly'
        type: choice
        options:
          - hourly      # resultats + analyse (comportement normal)
          - analyse     # analyse seule
          - resultats   # résultats seuls
          - pipeline    # pipeline complet (data + elo + modèle + analyse)

permissions:
  contents: write

jobs:
  tennis:
    name: "Tennis Auto"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dépendances ──────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Cache données (CSV, pkl) ─────────────────────────
      - name: Restore tennis_data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ github.run_id }}
          restore-keys: |
            tennis-data-

      # ── 5. Credentials Google (toujours depuis le secret) ───
      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p tennis_data
          printf '%s' "$GOOGLE_CREDENTIALS" > tennis_data/gsheet_credentials.json

      # ── 6. Détecter le type de run et vérifier la fenêtre ──────
      - name: Check run type and time window
        id: timecheck
        run: |
          PARIS_TIME="$(TZ='Europe/Paris' date '+%H:%M') Europe/Paris"
          UTC_HOUR=$(date -u +%H)
          UTC_DOW=$(date -u +%u)   # 1=lundi … 7=dimanche
          PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
          echo "Heure UTC : $(date -u '+%H:%M') | Paris : $PARIS_TIME | DOW : $UTC_DOW"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "pipeline" ]; then
              echo "is_pipeline=true" >> $GITHUB_OUTPUT
            else
              echo "is_pipeline=false" >> $GITHUB_OUTPUT
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "  → Déclenchement manuel (mode=$MODE)"

          elif [ "$UTC_DOW" = "1" ] && [ "$UTC_HOUR" = "06" ]; then
            # Lundi 06h UTC = pipeline hebdomadaire automatique
            echo "is_pipeline=true"  >> $GITHUB_OUTPUT
            echo "skip=false"        >> $GITHUB_OUTPUT
            echo "  → Pipeline hebdomadaire (lundi 07h Paris) ✓"

          elif [ "$PARIS_HOUR" -ge 7 ] && [ "$PARIS_HOUR" -le 23 ]; then
            echo "is_pipeline=false" >> $GITHUB_OUTPUT
            echo "skip=false"        >> $GITHUB_OUTPUT
            echo "  → Run analyse dans la fenêtre 07h-23h ✓"

          else
            echo "is_pipeline=false" >> $GITHUB_OUTPUT
            echo "skip=true"         >> $GITHUB_OUTPUT
            echo "  → Hors fenêtre 07h-23h ($PARIS_TIME) — run ignoré"
          fi

      # ── 7. Fallback pipeline si données absentes ────────────
      - name: Bootstrap pipeline (si cache absent)
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          steps.cache-data.outputs.cache-hit != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          echo "⚠  Cache absent — exécution du pipeline complet..."
          python tennis_auto.py --pipeline

      # ── 8a. Pipeline complet (lundi auto OU manuel) ─────────
      - name: Run pipeline
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          steps.timecheck.outputs.is_pipeline == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --pipeline

      # ── 8b. Résultats (runs analyse classiques uniquement) ───
      - name: Run resultats
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          steps.timecheck.outputs.is_pipeline == 'false' &&
          inputs.mode != 'analyse'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --resultats

      # ── 8c. Analyse (runs analyse classiques uniquement) ─────
      - name: Run analyse
        if: |
          steps.timecheck.outputs.skip == 'false' &&
          steps.timecheck.outputs.is_pipeline == 'false' &&
          inputs.mode != 'resultats'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python tennis_auto.py --analyse

      # ── 9. Sauvegarder le cache ──────────────────────────────
      - name: Save tennis_data cache
        if: steps.timecheck.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ github.run_id }}

      # ── 10. Rapport en artifact (30 jours) ──────────────────
      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ github.run_id }}
          path: tennis_data/rapports/
          retention-days: 30
          if-no-files-found: ignore
