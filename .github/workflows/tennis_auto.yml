name: Tennis Auto Pipeline

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (analyse / pipeline)'
        required: false
        default: 'analyse'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get week number
        id: week
        run: echo "week=$(date +%Y-%V)" >> $GITHUB_OUTPUT

      - name: Cache tennis_data
        uses: actions/cache@v4
        with:
          path: tennis_data
          key: tennis-data-${{ runner.os }}-week-${{ steps.week.outputs.week }}
          restore-keys: |
            tennis-data-${{ runner.os }}-week-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write gsheet credentials
        run: |
          mkdir -p tennis_data
          echo "${{ secrets.GSHEET_CREDENTIALS_B64 }}" | base64 -d > tennis_data/gsheet_credentials.json
          echo "{\"sheet_id\":\"${{ secrets.GSHEET_SHEET_ID }}\",\"sheet_url\":\"\",\"created\":\"2026-01-01\"}" > tennis_data/gsheet_config.json

      - name: Determine run mode
        id: mode
        run: |
          DOW=$(date +%u)
          HOUR=$(date +%H)
          if [ "$DOW" = "1" ] && [ "$HOUR" = "06" ]; then
            echo "mode=pipeline" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.mode }}" = "pipeline" ]; then
            echo "mode=pipeline" >> $GITHUB_OUTPUT
          else
            echo "mode=analyse" >> $GITHUB_OUTPUT
          fi

      - name: Run full pipeline
        if: steps.mode.outputs.mode == 'pipeline'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tennis_auto.py

      - name: Run analyse
        if: steps.mode.outputs.mode == 'analyse'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tennis_auto.py --analyse
